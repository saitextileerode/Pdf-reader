<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PDF Reader</title>
<style>
:root{--accent-fg:#fff}
body.theme-light{--bg:#f2f3f8;--surface:#ffffff;--fg:#14161c;--muted:#6b7280;--accent:#4f46e5;--line:#e4e6ee;--pagebg:#ffffff}
body.theme-sepia{--bg:#e9dcc3;--surface:#f6eddb;--fg:#3b2f1e;--muted:#8a7a60;--accent:#a0522d;--line:#dccdae;--pagebg:#f8efd9}
body.theme-dark{--bg:#0d0e12;--surface:#181a20;--fg:#e8e9ee;--muted:#9aa0ac;--accent:#8b93ff;--line:#2a2d36;--pagebg:#1b1b1b;--accent-fg:#101114}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:'Noto Sans Tamil',system-ui,-apple-system,'Segoe UI',sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none!important}
button{font-family:inherit}

/* top bar */
#top{position:relative;z-index:5;display:flex;align-items:center;gap:2px;padding:6px 8px 7px 18px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--surface);box-shadow:0 1px 0 var(--line)}
.ttl{flex:1;min-width:0}
#title{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:none;border:0;color:var(--fg);padding:0}
.ib:active{background:var(--line)}
.ib.on{color:var(--accent)}
#btnMark.on svg path{fill:currentColor}
#progress{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
#bar{height:100%;width:0;background:var(--accent);border-radius:0 3px 3px 0;transition:width .2s}

/* reader */
#view{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#pages{position:relative;width:max-content;min-width:100%;padding:6px 0 120px}
.page{position:relative;margin:10px auto;background:var(--pagebg);box-shadow:0 2px 12px rgba(0,0,0,.18);border-radius:3px;overflow:hidden}
canvas.pdf{display:block}
.theme-sepia canvas.pdf{filter:sepia(.5) saturate(.9) brightness(.97)}
.theme-dark canvas.pdf{filter:invert(1) hue-rotate(180deg) brightness(.92)}
canvas.ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:multiply}
.theme-dark canvas.ov{mix-blend-mode:normal}
body.annot canvas.ov{pointer-events:auto;touch-action:none}

/* welcome */
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:28px}
.hero{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),#ec4899);box-shadow:0 14px 34px rgba(79,70,229,.35);margin-bottom:10px}
.hero svg{width:52px;height:52px}
#empty h2{margin:0;font-size:24px}
#empty p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.5}

/* buttons */
.btn{height:44px;padding:0 20px;border-radius:14px;border:0;font-size:15px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:var(--bg);color:var(--fg)}
.btn.danger{background:none;color:#e53935}
.btn.big{height:52px;padding:0 34px;font-size:16.5px;border-radius:16px;box-shadow:0 8px 20px rgba(79,70,229,.3)}

/* floating dock */
.pill{display:flex;align-items:center;gap:2px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 26px rgba(0,0,0,.22)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;gap:4px}
#pagebox{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:0 4px}
#pageInput{width:54px;height:36px;text-align:center;font-size:16px;font-weight:700;border:0;background:var(--bg);color:var(--fg);border-radius:12px;font-family:inherit;-moz-appearance:textfield}
#pageInput::-webkit-outer-spin-button,#pageInput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#badge{position:fixed;right:14px;top:calc(76px + env(safe-area-inset-top));padding:6px 13px;border-radius:999px;background:rgba(20,22,28,.82);color:#fff;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7}

/* annotate bar */
#annbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:6}
.tool{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:var(--fg);padding:0}
.tool.sel{background:var(--accent);color:var(--accent-fg)}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);margin:0 4px;padding:0}
.dot.sel{box-shadow:0 0 0 3px var(--accent)}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:20}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:84%;display:flex;flex-direction:column;background:var(--surface);border-radius:24px 24px 0 0;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.handle{width:42px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 0}
.shead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 4px 22px;font-weight:800;font-size:17.5px}
#searchBox{display:flex;gap:8px;padding:6px 14px 8px}
#q{flex:1;height:44px;font-size:16px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);font-family:inherit}
#sbody{overflow:auto;padding:4px 12px 18px}
.row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:14px;font-size:15.5px}
.row:active{background:var(--bg)}
.row .ri{color:var(--accent);display:grid}
.row .rt{flex:1;min-width:0;word-break:break-word}
.rs{font-size:12px;color:var(--muted);margin-top:2px}
.res{padding:12px 14px;border-radius:14px;background:var(--bg);margin:7px 0;font-size:14px;line-height:1.45}
.res b{color:var(--accent);display:block;font-size:12.5px;margin-bottom:2px}
.msg{padding:26px 10px;text-align:center;color:var(--muted);font-size:14.5px}

/* note modal */
#modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:20px}
.mcard{width:100%;max-width:380px;background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.mt{font-weight:800;font-size:17px;margin-bottom:10px}
#noteText{width:100%;min-height:120px;resize:none;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;background:var(--bg);color:var(--fg);font-family:inherit}
.mbtns{display:flex;align-items:center;gap:8px;margin-top:12px}
.grow{flex:1}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:86%;text-align:center;background:rgba(25,27,33,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body class="theme-light">

<header id="top">
  <div class="ttl"><div id="title">PDF Reader</div><div id="sub">படிக்க தயார்</div></div>
  <button class="ib" id="btnSearch" data-i="search" aria-label="தேடு"></button>
  <button class="ib" id="btnMark" data-i="bookmark" aria-label="புக்மார்க்"></button>
  <button class="ib" id="btnAnn" data-i="pen" aria-label="குறிக்க"></button>
  <button class="ib" id="btnMenu" data-i="more" aria-label="மெனு"></button>
  <div id="progress"><div id="bar"></div></div>
</header>

<main id="view">
  <div id="pages"></div>
  <div id="empty">
    <div class="hero" data-i="file"></div>
    <h2>PDF Reader</h2>
    <p>படிக்க, குறிக்க, பகிர்<br>எல்லாம் ஒரே app-ல்</p>
    <button class="btn pri big" id="btnOpen2">PDF திற</button>
  </div>
</main>

<div id="badge"></div>

<div id="annbar" class="hidden">
  <div id="colors" class="pill hidden"></div>
  <div class="pill">
    <button class="tool sel" data-tool="hand" data-i="hand" aria-label="பார்க்க"></button>
    <button class="tool" data-tool="pen" data-i="pen" aria-label="பேனா"></button>
    <button class="tool" data-tool="hl" data-i="hl" aria-label="ஹைலைட்"></button>
    <button class="tool" data-tool="note" data-i="note" aria-label="குறிப்பு"></button>
    <button class="tool" data-tool="eraser" data-i="eraser" aria-label="அழி"></button>
    <span class="sep"></span>
    <button class="tool" id="btnUndo" data-i="undo" aria-label="செயல்தவிர்"></button>
  </div>
</div>

<div id="dock" class="pill">
  <button class="tool" id="zoomOut" data-i="minus" aria-label="சிறிதாக்கு"></button>
  <div id="pagebox"><input id="pageInput" type="number" inputmode="numeric" min="1" value="1"><span>/ <span id="total">0</span></span></div>
  <button class="tool" id="zoomIn" data-i="plus" aria-label="பெரிதாக்கு"></button>
</div>

<div id="sheetWrap" class="hidden">
  <div id="backdrop"></div>
  <div id="sheet">
    <div class="handle"></div>
    <div class="shead"><span id="sTitle"></span><button class="ib" id="sClose" data-i="close"></button></div>
    <div id="searchBox" class="hidden">
      <input id="q" type="search" placeholder="வார்த்தையை தேடு...">
      <button class="btn pri" id="goSearch">தேடு</button>
    </div>
    <div id="sbody"></div>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="mcard">
    <div class="mt">குறிப்பு</div>
    <textarea id="noteText" placeholder="இங்கே எழுதுங்கள்..."></textarea>
    <div class="mbtns">
      <button class="btn danger hidden" id="noteDel">நீக்கு</button>
      <span class="grow"></span>
      <button class="btn sec" id="noteCancel">ரத்து</button>
      <button class="btn pri" id="noteSave">சேமி</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<input id="file" type="file" accept="application/pdf" hidden>

<script src="lib/pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from './lib/pdf.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = './lib/pdf.worker.min.js';

const $ = s => document.querySelector(s);
const view = $('#view'), pagesEl = $('#pages');
const CAP = window.Capacitor, P = (CAP && CAP.Plugins) || {};
const native = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
const plug = n => P[n] || (CAP && CAP.registerPlugin ? CAP.registerPlugin(n) : null);

/* ---------- icons ---------- */
const ICONS = {
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
  bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',
  more: '<circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/>',
  folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/>',
  print: '<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="9" rx="2"/><rect x="7" y="14" width="10" height="7"/>',
  save: '<path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 20h16"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  book: '<path d="M2 4h7a3 3 0 013 3v14a2 2 0 00-2-2H2z"/><path d="M22 4h-7a3 3 0 00-3 3v14a2 2 0 012-2h8z"/>',
  minus: '<path d="M5 12h14"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  hand: '<path d="M5 3l14 8-6 2-2 6z"/>',
  hl: '<path d="M9 11l-6 6v4h4l6-6"/><path d="M22 7l-5-5-9 9 5 5z"/>',
  note: '<path d="M4 4h16v12H9l-5 5z"/><path d="M8 9h8M8 12.5h5"/>',
  eraser: '<path d="M7 21h10"/><path d="M5.5 15.5L15 6l5 5-8 8H8z"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  file: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>'
};
const icon = (n, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;
document.querySelectorAll('[data-i]').forEach(el => el.innerHTML = icon(el.dataset.i));

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const idb = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('pdfreader', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async put(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', 'readwrite'); t.objectStore('files').put(v, k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const r = db.transaction('files').objectStore('files').get(k);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async del(k) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('files', 'readwrite'); t.objectStore('files').delete(k);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  }
};

/* ---------- state ---------- */
let pdf = null, docKey = '', docName = '', origBytes = null, pageCount = 0, current = 1;
let baseSize = null, zoom = store.get('zoom', 1), gen = 0, texts = null, lastW = 0, saveTimer = null, annTimer = null;
let ann = {}, hist = [], live = null, tool = 'hand';
const PEN = ['#e53935', '#1e88e5', '#43a047', '#fb8c00', '#8e24aa'];
const HL = ['#ffeb3b', '#76ff03', '#ff4081', '#18ffff'];
let penColor = store.get('penColor', PEN[0]), hlColor = store.get('hlColor', HL[0]);

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---------- themes ---------- */
const THEMES = ['light', 'sepia', 'dark'];
const THEME_LABEL = { light: 'வெளிச்சம்', sepia: 'செப்பியா (கண்ணுக்கு இதம்)', dark: 'இருள்' };
const THEME_ICON = { light: 'sun', sepia: 'book', dark: 'moon' };
function applyTheme() {
  const t = store.get('theme', 'light');
  document.body.classList.remove('theme-light', 'theme-sepia', 'theme-dark');
  document.body.classList.add('theme-' + t);
}
function nextTheme() {
  const t = store.get('theme', 'light');
  store.set('theme', THEMES[(THEMES.indexOf(t) + 1) % 3]);
  applyTheme(); toast('தீம்: ' + THEME_LABEL[store.get('theme', 'light')]);
}
applyTheme();

/* ---------- sheet ---------- */
function openSheet(title, withSearch) {
  $('#sTitle').textContent = title;
  $('#searchBox').classList.toggle('hidden', !withSearch);
  $('#sheetWrap').classList.remove('hidden');
}
function closeSheet() { $('#sheetWrap').classList.add('hidden'); }
$('#backdrop').onclick = closeSheet; $('#sClose').onclick = closeSheet;
const setBody = (...n) => $('#sbody').replaceChildren(...n);
function msg(t) { const d = document.createElement('div'); d.className = 'msg'; d.textContent = t; setBody(d); }
function row(ic, title, sub, onclick) {
  const r = document.createElement('div'); r.className = 'row';
  r.innerHTML = `<span class="ri">${icon(ic)}</span><div class="rt"></div>`;
  const rt = r.querySelector('.rt'); rt.textContent = title;
  if (sub) { const s = document.createElement('div'); s.className = 'rs'; s.textContent = sub; rt.appendChild(s); }
  r.onclick = onclick; return r;
}
const needPdf = fn => () => { if (!pdf) { toast('முதலில் PDF திறக்கவும்'); return; } fn(); };

function openMenu() {
  openSheet('மெனு', false);
  const t = store.get('theme', 'light');
  setBody(
    row('folder', 'PDF திற', null, () => { closeSheet(); $('#file').click(); }),
    row('clock', 'சமீபத்தியவை', null, showRecents),
    row('list', 'பொருளடக்கம்', null, needPdf(showOutline)),
    row('bookmark', 'புக்மார்க்குகள்', null, needPdf(showMarks)),
    row('share', 'பகிர்', null, needPdf(() => { closeSheet(); doShare(); })),
    row('print', 'அச்சிடு', null, needPdf(() => { closeSheet(); doPrint(); })),
    row('save', 'நகலை சேமி', 'நீங்கள் குறித்தவையுடன் சேமிக்கும்', needPdf(() => { closeSheet(); doSave(); })),
    row(THEME_ICON[t], 'தீம் மாற்று', THEME_LABEL[t], () => { nextTheme(); closeSheet(); })
  );
}
$('#btnMenu').onclick = openMenu;

/* ---------- recents ---------- */
const recents = () => store.get('recent', []);
function touchRecent(key, name, pages) {
  const r = recents().filter(x => x.key !== key);
  r.unshift({ key, name, pages, t: Date.now() });
  const drop = r.splice(5);
  store.set('recent', r);
  drop.forEach(x => idb.del('file:' + x.key).catch(() => {}));
}
function showRecents() {
  openSheet('சமீபத்தியவை', false);
  const r = recents();
  if (!r.length) return msg('இன்னும் எதுவும் இல்லை');
  setBody(...r.map(x => row('file', x.name, `பக்கம் ${store.get('last:' + x.key, 1)} / ${x.pages || '?'}`, () => { closeSheet(); openRecent(x.key); })));
}
async function openRecent(key) {
  const meta = recents().find(x => x.key === key);
  try {
    const blob = await idb.get('file:' + key);
    if (!blob || !meta) throw 0;
    await openData(await blob.arrayBuffer(), meta.name, true);
  } catch { toast('இந்த கோப்பு கிடைக்கவில்லை'); }
}

/* ---------- open ---------- */
$('#btnOpen2').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const buf = await f.arrayBuffer(); e.target.value = '';
  await openData(buf, f.name);
};

async function openData(buf, name, fromRecent) {
  toast('திறக்கிறது...');
  const orig = new Uint8Array(buf), size = orig.byteLength;
  try {
    const base = new URL('./lib/', location.href).href;
    const task = pdfjsLib.getDocument({
      data: orig.slice(0),
      cMapUrl: base + 'cmaps/', cMapPacked: true, standardFontDataUrl: base + 'standard_fonts/'
    });
    task.onPassword = (update, reason) => {

}
function downloadBlob(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
const isCancel = e => /cancel/i.test(String((e && e.message) || e));

async function doShare() {
  try {
    const o = await currentOutput();
    if (native) { const uri = await stage(o); await plug('Share').share({ title: o.name, url: uri, dialogTitle: 'PDF-ஐ பகிர்' }); }
    else {
      const f = new File([o.bytes], o.name, { type: 'application/pdf' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) await navigator.share({ files: [f] }); else downloadBlob(f);
    }
  } catch (e) { if (!isCancel(e)) toast('பகிர முடியவில்லை'); }
}
async function doPrint() {
  if (!native) return toast('அச்சிடுதல் Android app-ல் மட்டும் வேலை செய்யும்');
  try {
    const o = await currentOutput(), uri = await stage(o);
    await plug('PdfPrint').print({ uri, name: o.name });
  } catch (e) { toast('அச்சிட முடியவில்லை'); }
}
async function doSave() {
  try {
    const o = await currentOutput();
    if (!native) { downloadBlob(new File([o.bytes], o.name, { type: 'application/pdf' })); return; }
    try {
      await plug('Filesystem').writeFile({ path: 'PDF Reader/' + o.name, data: toB64(o.bytes), directory: 'DOCUMENTS', recursive: true });
      toast('Documents / PDF Reader-ல் சேமிக்கப்பட்டது');
    } catch {
      const uri = await stage(o);
      toast('Files அல்லது Drive-ஐ தேர்வு செய்து சேமிக்கவும்');
      await plug('Share').share({ title: o.name, url: uri, dialogTitle: 'எங்கே சேமிக்க?' });
    }
  } catch (e) { if (!isCancel(e)) toast('சேமிக்க முடியவில்லை'); }
}

/* ---------- open with (from other apps) ---------- */
let lastUrl = '', lastUrlT = 0;
async function openFromUrl(url) {
  if (!url) return;
  const now = Date.now();
  if (url === lastUrl && now - lastUrlT < 4000) return;
  lastUrl = url; lastUrlT = now;
  try {
    toast('திறக்கிறது...');
    const r = await fetch(CAP.convertFileSrc(url));
    if (!r.ok) throw 0;
    const buf = await r.arrayBuffer();
    let name = decodeURIComponent(url.split('?')[0]).split('/').pop().split(':').pop();
    if (!/\.pdf$/i.test(name)) name = 'PDF-' + buf.byteLength + '.pdf';
    await openData(buf, name);
  } catch { toast('இந்த PDF-ஐ திறக்க முடியவில்லை'); }
}

if (native) {
  const A = plug('App');
  A.addListener('appUrlOpen', e => openFromUrl(e.url));
  A.addListener('backButton', () => {
    if (!$('#modal').classList.contains('hidden')) closeModal();
    else if (!$('#sheetWrap').classList.contains('hidden')) closeSheet();
    else if (!$('#annbar').classList.contains('hidden')) setAnnMode(false);
    else A.minimizeApp();
  });
}

/* ---------- start ---------- */
(async () => {
  let launch = null;
  if (native) { try { const r = await plug('App').getLaunchUrl(); launch = r && r.url; } catch {} }
  if (launch) return openFromUrl(launch);
  const r = recents()[0];
  if (r) openRecent(r.key);
})();
</script>
